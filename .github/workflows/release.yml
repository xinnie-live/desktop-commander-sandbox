name: Release

# Push the chosen release tag (it must match package.json) to:
#   1. build the image natively on amd64 and arm64 runners (no QEMU, no third-party actions)
#   2. publish ghcr.io/<owner>/desktop-commander-sandbox:<version> as a multi-arch manifest
#   3. create a draft GitHub Release; publish it after anonymous image/download checks
# Manual runs exercise preparation only: no registry login, image push, manifest or Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  validate:
    name: Validate release before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.21.0
          package-manager-cache: false
      - name: Install and validate third-party notices with the pinned toolchain
        run: |
          npm install --global npm@10.9.4 --ignore-scripts --no-audit --no-fund
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm run remote-device:notices
      - name: Check package, lockfile, Compose, changelog and tag consistency
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            node scripts/validate-release.mjs --rehearsal
          else
            node scripts/validate-release.mjs --tag "$GITHUB_REF_NAME"
          fi
      - name: Test and validate the archive
        run: |
          npm audit --omit=dev --ignore-scripts --registry=https://registry.npmjs.org
          npm test
          node scripts/validate-compose.mjs --self-test
          npm run remote-device:package
          (cd dist && sha256sum --check desktop-commander-sandbox-*.zip.sha256)
          unzip -q "dist/desktop-commander-sandbox-$(node -p 'require("./package.json").version').zip" -d /tmp/release-check
          (cd /tmp/release-check/desktop-commander-sandbox-* && npm test)
      - name: Verify native source attachment before any image publication
        run: |
          npm run remote-device:third-party
          (cd dist && sha256sum --check desktop-commander-sandbox-third-party-sources-*.tar.gz.sha256)
      - name: Preserve the verified release attachments
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-materials-${{ github.sha }}
          path: |
            dist/desktop-commander-sandbox-*.zip
            dist/desktop-commander-sandbox-*.zip.sha256
            dist/desktop-commander-sandbox-third-party-sources-*.tar.gz
            dist/desktop-commander-sandbox-third-party-sources-*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  image:
    needs: validate
    name: Build image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.21.0
          package-manager-cache: false
      - name: Build and smoke-test the architecture image
        run: |
          version="$(node -p 'require("./package.json").version')"
          docker build --tag "ghcr.io/xinnie-live/desktop-commander-sandbox:${version}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${version}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" .
          sh scripts/smoke-helper.sh
          sh scripts/smoke-integration.sh
          sh scripts/smoke-dependencies.sh
          sh scripts/smoke-compose-runtime.sh
          node scripts/verify-host-runtime.mjs
          sh scripts/smoke-proxy-runtime.sh
      - name: Push architecture image only for a release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/desktop-commander-sandbox"
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker tag "ghcr.io/xinnie-live/desktop-commander-sandbox:${version}" "${repo}:${version}-${{ matrix.arch }}"
          docker push "${repo}:${version}-${{ matrix.arch }}"

  manifest:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Publish multi-arch manifest
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Combine architecture images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/desktop-commander-sandbox"
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker buildx imagetools create --tag "${repo}:${version}" --tag "${repo}:latest" \
            "${repo}:${version}-amd64" "${repo}:${version}-arm64"
          docker buildx imagetools inspect "${repo}:${version}"

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Draft GitHub Release
    needs: manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.0
          package-manager-cache: false
      - name: Download the already validated attachments
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-materials-${{ github.sha }}
          path: dist
      - name: Verify attachment checksums again
        run: (cd dist && sha256sum --check ./*.sha256)
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/desktop-commander-sandbox"
          notes="$(mktemp)"
          # Use the matching CHANGELOG section as release notes.
          awk -v v="$version" '$0 ~ "^## \\["v"\\]" {p=1; next} p && /^## \[/ {exit} p' CHANGELOG.md > "$notes"
          cat >> "$notes" <<EOF

          ### Prebuilt image

          \`\`\`sh
          docker pull ${repo}:${version}
          \`\`\`

          Then run \`npm run remote-device:start\` without building locally.

          ### Third-party notices and native library source

          The source ZIP contains THIRD-PARTY-NOTICES.md and a pinned source manifest.
          The separate third-party-sources archive contains the native library sources,
          upstream patches and build recipe, with a SHA-256 checksum alongside it.
          EOF
          gh release create "${GITHUB_REF_NAME}" "dist/desktop-commander-sandbox-${version}.zip" "dist/desktop-commander-sandbox-${version}.zip.sha256" \
            "dist/desktop-commander-sandbox-third-party-sources-${version}.tar.gz" "dist/desktop-commander-sandbox-third-party-sources-${version}.tar.gz.sha256" \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file "$notes" --draft --verify-tag
