version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Disable routine version PRs; security updates use a separate limit.
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    # Disable routine version PRs; security updates use a separate limit.
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    # Disable routine version PRs; security updates use a separate limit.
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
